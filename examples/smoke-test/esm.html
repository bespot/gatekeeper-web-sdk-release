<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gatekeeper Web SDK — Smoke Test (ESM)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Sofia+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bespot-navy: #231f40;
        --bespot-navy-muted: rgba(35, 31, 64, 0.62);
        --bespot-navy-soft: rgba(35, 31, 64, 0.08);
        --bespot-magenta: #e41c51;
        --bespot-magenta-hover: #c81645;
        --bespot-blue: #1863dc;
        --bespot-surface: #ffffff;
        --bespot-page: #f4f4f4;
        --bespot-page-accent: #eef2f8;
        --bespot-border: #e0e2e8;
        --radius: 12px;
        --radius-pill: 40px;
        color-scheme: light;
        font-family: Manrope, system-ui, sans-serif;
        line-height: 1.45;
        color: var(--bespot-navy);
        background: var(--bespot-page);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            1200px 480px at 12% -10%,
            rgba(24, 99, 220, 0.1),
            transparent 55%
          ),
          radial-gradient(
            900px 420px at 100% 0%,
            rgba(228, 28, 81, 0.08),
            transparent 50%
          ),
          linear-gradient(180deg, var(--bespot-page-accent), var(--bespot-page));
      }

      .page {
        width: min(40rem, calc(100% - 2rem));
        margin: 0 auto;
        padding: 1.75rem 0 2.5rem;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.35rem;
      }

      .brand {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.45rem;
      }

      .brand-mark {
        font-family: 'Sofia Sans', Manrope, sans-serif;
        font-weight: 700;
        font-size: 1.05rem;
        letter-spacing: 0.02em;
        color: var(--bespot-magenta);
      }

      .brand-chip {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--bespot-magenta);
        background: rgba(228, 28, 81, 0.1);
        border-radius: 999px;
        padding: 0.2rem 0.55rem;
      }

      .brand-chip.muted {
        color: var(--bespot-navy-muted);
        background: rgba(35, 31, 64, 0.08);
      }

      .sdk-version {
        flex-shrink: 0;
        font-family: 'Sofia Sans', Manrope, sans-serif;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--bespot-navy);
        background: rgba(35, 31, 64, 0.06);
        border-radius: 999px;
        padding: 0.35rem 0.7rem;
        white-space: nowrap;
      }

      .panel {
        background: var(--bespot-surface);
        border: 1px solid var(--bespot-border);
        border-radius: var(--radius);
        padding: 1.1rem 1.15rem 1.2rem;
        margin: 0 0 0.85rem;
      }

      .panel h2 {
        font-family: 'Sofia Sans', Manrope, sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }

      label {
        display: block;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        margin: 0.65rem 0 0.25rem;
        color: var(--bespot-navy-muted);
      }

      .panel > label:first-of-type {
        margin-top: 0;
      }

      input,
      textarea {
        width: 100%;
        font: inherit;
        color: var(--bespot-navy);
        background: #fbfbfd;
        border: 1px solid var(--bespot-border);
        border-radius: 8px;
        padding: 0.55rem 0.7rem;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: rgba(24, 99, 220, 0.55);
        box-shadow: 0 0 0 3px rgba(24, 99, 220, 0.15);
        background: #fff;
      }

      input:read-only,
      textarea:read-only {
        color: var(--bespot-navy-muted);
        background: #f3f4f7;
        cursor: default;
      }

      input:read-only:focus,
      textarea:read-only:focus {
        border-color: var(--bespot-border);
        box-shadow: none;
      }

      textarea {
        min-height: 4.75rem;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.82rem;
      }

      .secret-field {
        position: relative;
      }

      .secret-field input {
        width: 100%;
        padding-right: 2.75rem;
      }

      .secret-field .toggle-secret {
        position: absolute;
        top: 50%;
        right: 0.35rem;
        transform: translateY(-50%);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.1rem;
        height: 2.1rem;
        margin: 0;
        padding: 0;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--bespot-navy-muted);
        cursor: pointer;
      }

      .secret-field .toggle-secret:hover {
        color: var(--bespot-navy);
        background: var(--bespot-navy-soft);
      }

      .secret-field .toggle-secret:focus-visible {
        outline: 2px solid rgba(24, 99, 220, 0.55);
        outline-offset: 2px;
      }

      .secret-field .toggle-secret:active {
        transform: translateY(-50%);
      }

      .secret-field .toggle-secret svg {
        width: 1.15rem;
        height: 1.15rem;
        display: block;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 0.75rem;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.55rem;
        align-items: end;
      }

      .row label {
        grid-column: 1 / -1;
      }

      @media (max-width: 560px) {
        .grid-2,
        .row {
          grid-template-columns: 1fr;
        }

        .row button {
          width: 100%;
        }
      }

      .run {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.65rem;
        margin: 0.15rem 0 0.85rem;
      }

      @media (max-width: 420px) {
        .run {
          grid-template-columns: 1fr;
        }
      }

      button {
        font-family: 'Sofia Sans', Manrope, sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        border-radius: var(--radius-pill);
        padding: 0.6rem 1.15rem;
        cursor: pointer;
        border: 1.5px solid transparent;
        transition:
          background 0.15s ease,
          color 0.15s ease,
          border-color 0.15s ease,
          transform 0.1s ease;
      }

      button:active {
        transform: translateY(1px);
      }

      button.primary {
        background: var(--bespot-magenta);
        color: #fff;
        border-color: var(--bespot-magenta);
      }

      button.primary:hover {
        background: var(--bespot-magenta-hover);
        border-color: var(--bespot-magenta-hover);
      }

      button.secondary {
        background: transparent;
        color: var(--bespot-magenta);
        border-color: var(--bespot-magenta);
      }

      button.secondary:hover {
        background: rgba(228, 28, 81, 0.08);
      }

      button.ghost {
        background: transparent;
        color: var(--bespot-navy);
        border-color: var(--bespot-border);
        white-space: nowrap;
      }

      button.ghost:hover {
        border-color: rgba(35, 31, 64, 0.35);
        background: var(--bespot-navy-soft);
      }

      #log {
        min-height: 9rem;
        max-height: 20rem;
        overflow: auto;
        padding: 0.75rem 0.85rem;
        background: #1a1730;
        color: #e8e6f2;
        border-radius: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.78rem;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      #log:empty::before {
        content: 'Action results will appear here…';
        color: rgba(232, 230, 242, 0.45);
      }


      .sandbox {
        margin: 0 0 1.1rem;
        padding: 0.75rem 0.9rem;
        border-radius: var(--radius);
        border: 1px solid rgba(228, 28, 81, 0.28);
        background: rgba(228, 28, 81, 0.06);
        font-size: 0.82rem;
        color: var(--bespot-navy);
      }

      .sandbox a {
        color: var(--bespot-magenta);
        font-weight: 600;
      }

      .twin-link {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--bespot-blue);
        text-decoration: none;
        margin-left: 0.35rem;
      }

      .twin-link:hover {
        text-decoration: underline;
      }

      .ok {
        color: #5ddea0;
      }

      .fail {
        color: #ff7a9c;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="top">
        <div class="brand">
          <div class="brand-mark">bespot</div>
          <span class="brand-chip">Gatekeeper</span>
          <span class="brand-chip muted">Smoke · ESM</span>
          <a class="twin-link" href="./umd.html">UMD version</a>
        </div>
        <div class="sdk-version" id="sdkVersion">…</div>
      </header>

      <p class="sandbox">
        <strong>Sandbox only.</strong>
        Get JWT puts your OAuth client secret in the browser — never ship this in production.
        Production apps must mint JWTs on your server.
        See
        <a href="../../docs/authentication.md">Authentication</a>.
      </p>

      <section class="panel">
        <h2>Config</h2>
        <label for="baseUrl">Backend URL</label>
        <input
          id="baseUrl"
          value="https://gatekeeper.bespot.dev/v2"
          autocomplete="off"
          readonly
        />
        <label for="apiKey">API key</label>
        <div class="secret-field">
          <input
            id="apiKey"
            type="password"
            value=""
            placeholder="Enter API key"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="toggle-secret"
            data-target="apiKey"
            aria-label="Show API key"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 5c-5 0-9.27 3.11-11 7 1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5A2.5 2.5 0 1 0 12 9a2.5 2.5 0 0 0 0 5z"
              />
            </svg>
          </button>
        </div>
        <div class="grid-2">
          <div>
            <label for="applicationId">Application ID</label>
            <input
              id="applicationId"
              value=""
              placeholder="Enter application ID"
              autocomplete="off"
            />
          </div>
          <div>
            <label for="applicationVersion">Application version</label>
            <input
              id="applicationVersion"
              value=""
              placeholder="Enter application version"
              autocomplete="off"
            />
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>Auth</h2>
        <label for="authServerUrl">Cognito token URL</label>
        <input
          id="authServerUrl"
          value="https://gatekeeper.auth.eu-west-1.amazoncognito.com"
          autocomplete="off"
          readonly
        />
        <div class="grid-2">
          <div>
            <label for="clientId">Client ID</label>
            <input
              id="clientId"
              value=""
              placeholder="Enter client ID"
              autocomplete="off"
            />
          </div>
          <div>
            <label for="clientSecret">Client secret</label>
            <div class="secret-field">
              <input
                id="clientSecret"
                type="password"
                value=""
                placeholder="Enter client secret"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="toggle-secret"
                data-target="clientSecret"
                aria-label="Show client secret"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M12 5c-5 0-9.27 3.11-11 7 1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5A2.5 2.5 0 1 0 12 9a2.5 2.5 0 0 0 0 5z"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="row">
          <label for="scope">OAuth scope</label>
          <input
            id="scope"
            value="main_antifraud_resource_server/public"
            autocomplete="off"
            readonly
          />
          <button type="button" class="secondary" id="btnGetJwt">
            Get JWT
          </button>
        </div>
        <label for="jwt">JWT</label>
        <textarea
          id="jwt"
          placeholder="Paste a JWT here, or use Get JWT"
          spellcheck="false"
        ></textarea>
      </section>

      <div class="run">
        <button type="button" class="primary" id="btnInitialize">
          Initialize
        </button>
        <button type="button" class="secondary" id="btnCheck">Check</button>
      </div>

      <section class="panel">
        <div id="log" aria-live="polite" aria-label="Action results"></div>
      </section>
    </div>

    <script type="module">
      const SDK_ESM_URL = '../../dist/safe-sdk.esm.min.js'
      const SDK_PKG_JSON_URL = '../../package.json'

      const logEl = document.getElementById('log')
      const sdkVersionEl = document.getElementById('sdkVersion')
      let SafeSDK
      let sdk

      function configFromForm() {
        return {
          baseUrl: document.getElementById('baseUrl').value.trim(),
          apiKey: document.getElementById('apiKey').value.trim(),
          applicationId: document.getElementById('applicationId').value.trim(),
          applicationVersion: document
            .getElementById('applicationVersion')
            .value.trim(),
        }
      }

      function ensureSdk(withConfig) {
        if (typeof SafeSDK !== 'function') {
          throw new Error(
            'SafeSDK ESM not loaded. Serve the release repo root over HTTP so ../../dist/safe-sdk.esm.min.js resolves.',
          )
        }
        if (!sdk) {
          if (!withConfig) {
            throw new Error('Initialize first')
          }
          sdk = new SafeSDK(configFromForm())
          return sdk
        }
        if (withConfig) {
          sdk = new SafeSDK(configFromForm())
        }
        return sdk
      }

      function formatError(err) {
        if (err instanceof Error) {
          return (err.name || 'Error') + ' — ' + (err.message || String(err))
        }
        return String(err)
      }

      function appendLog(ok, action, detail) {
        const line = document.createElement('div')
        line.className = ok ? 'ok' : 'fail'
        const stamp = new Date().toISOString().slice(11, 19)
        line.textContent =
          '[' +
          stamp +
          '] ' +
          (ok ? 'OK' : 'FAIL') +
          ' ' +
          action +
          (detail ? ': ' + detail : '')
        logEl.appendChild(line)
        logEl.scrollTop = logEl.scrollHeight
      }

      async function run(action, fn) {
        try {
          await fn()
        } catch (err) {
          appendLog(false, action, formatError(err))
        }
      }

      async function resolveSdkVersion() {
        const response = await fetch(SDK_PKG_JSON_URL, { cache: 'no-store' })
        if (!response.ok) {
          throw new Error('HTTP ' + response.status + ' fetching package.json')
        }
        const pkg = await response.json()
        if (!pkg || typeof pkg.version !== 'string') {
          throw new Error('package.json missing version')
        }
        return pkg.version
      }

      void (async function bootstrapSdk() {
        let version = null
        let versionError = null
        try {
          version = await resolveSdkVersion()
        } catch (err) {
          versionError = err
        }

        try {
          const mod = await import(SDK_ESM_URL)
          SafeSDK = mod.default
          if (typeof SafeSDK !== 'function') {
            throw new Error('ESM module loaded but default export SafeSDK is missing')
          }
        } catch (err) {
          sdkVersionEl.textContent = '—'
          appendLog(
            false,
            'Load SDK',
            formatError(err) +
              '. Serve the release repo root (npx serve .) then open /examples/smoke-test/esm.html',
          )
          return
        }

        if (version) {
          sdkVersionEl.textContent = version
          appendLog(true, 'Load SDK', 'esm@' + version + ' (' + SDK_ESM_URL + ')')
        } else {
          sdkVersionEl.textContent = 'local dist'
          appendLog(true, 'Load SDK', 'esm (' + SDK_ESM_URL + ')')
          if (versionError) {
            appendLog(false, 'SDK version', formatError(versionError))
          }
        }
      })()

      var EYE_OPEN =
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5c-5 0-9.27 3.11-11 7 1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5A2.5 2.5 0 1 0 12 9a2.5 2.5 0 0 0 0 5z"/></svg>'
      var EYE_OFF =
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2.1 3.51 3.51 2.1l18.39 18.39-1.41 1.41-3.13-3.13A12.7 12.7 0 0 1 12 19c-5 0-9.27-3.11-11-7a13.3 13.3 0 0 1 4.4-5.16L2.1 3.51zM12 7a5 5 0 0 1 5 5c0 .7-.15 1.36-.41 1.96l-1.6-1.6A2.5 2.5 0 0 0 12 9.5c-.2 0-.4.03-.58.08L9.58 7.74C10.3 7.27 11.12 7 12 7zm9.66 2.2-1.5 1.5c.55.7.98 1.47 1.28 2.3-1.73 3.89-6 7-11 7-.9 0-1.77-.12-2.6-.33l-1.66 1.66c1.33.43 2.76.67 4.26.67 5 0 9.27-3.11 11-7a13.4 13.4 0 0 0-2.78-3.8z"/></svg>'

      document.querySelectorAll('.toggle-secret').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const input = document.getElementById(btn.getAttribute('data-target'))
          if (!input) return
          const showing = input.type === 'text'
          input.type = showing ? 'password' : 'text'
          btn.innerHTML = showing ? EYE_OPEN : EYE_OFF
          btn.setAttribute(
            'aria-label',
            (showing ? 'Show' : 'Hide') + ' ' + (input.id || 'secret'),
          )
        })
      })

      document.getElementById('btnGetJwt').addEventListener('click', function () {
        void run('Get JWT', async function () {
          const authServerUrl = document
            .getElementById('authServerUrl')
            .value.trim()
            .replace(/\/$/, '')
          const clientId = document.getElementById('clientId').value.trim()
          const clientSecret = document
            .getElementById('clientSecret')
            .value.trim()
          const scope = document.getElementById('scope').value.trim()
          if (!authServerUrl || !clientId || !clientSecret) {
            appendLog(
              false,
              'Get JWT',
              'auth server URL, client ID, and client secret are required',
            )
            return
          }

          const body = new URLSearchParams()
          body.set('grant_type', 'client_credentials')
          if (scope) body.set('scope', scope)

          const basic = btoa(clientId + ':' + clientSecret)
          let response
          try {
            response = await fetch(authServerUrl + '/oauth2/token', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                Authorization: 'Basic ' + basic,
              },
              body: body.toString(),
            })
          } catch (err) {
            throw new Error(
              'Could not reach auth server (often Cognito CORS from the browser). Use curl instead. ' +
                formatError(err),
            )
          }

          const text = await response.text()
          let json
          try {
            json = JSON.parse(text)
          } catch {
            throw new Error(
              'HTTP ' +
                response.status +
                ' — non-JSON response: ' +
                text.slice(0, 200),
            )
          }
          if (!response.ok) {
            throw new Error(
              'HTTP ' +
                response.status +
                ' — ' +
                (json.error_description || json.error || text.slice(0, 200)),
            )
          }
          const token = json.access_token
          if (!token || typeof token !== 'string') {
            throw new Error('Response missing access_token')
          }
          document.getElementById('jwt').value = token
          appendLog(
            true,
            'Get JWT',
            'token set' +
              (json.expires_in ? ' (expires_in=' + json.expires_in + 's)' : ''),
          )
        })
      })

      document
        .getElementById('btnInitialize')
        .addEventListener('click', function () {
          void run('Initialize', async function () {
            const jwt = document.getElementById('jwt').value.trim()
            if (!jwt) {
              appendLog(false, 'Initialize', 'JWT is empty')
              return
            }
            ensureSdk(true)
            await sdk.initialize(jwt)
            appendLog(true, 'Initialize', 'registered')
          })
        })

      document.getElementById('btnCheck').addEventListener('click', function () {
        void run('Check', async function () {
          ensureSdk(false)
          const result = await sdk.check()
          if (result instanceof Error) {
            appendLog(false, 'Check', formatError(result))
            return
          }
          appendLog(
            true,
            'Check',
            'action=' + result.action + ' ticket=' + result.ticket,
          )
        })
      })
    </script>
  </body>
</html>
