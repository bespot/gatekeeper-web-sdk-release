name: Validate Release

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate Release PR
    # Skip drafts so auto-opened release PRs can be finished without failing checks.
    if: >-
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: validate-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6

      - name: Validate release
        id: validate
        uses: ./.github/actions/validate-release
        with:
          branch: ${{ github.event.pull_request.head.ref }}
          source_repo: ${{ secrets.SOURCE_REPO }}
          source_repo_pat: ${{ secrets.SOURCE_REPO_PAT }}
          npm_package: ${{ secrets.NPM_PACKAGE }}
          github_repository: ${{ github.repository }}
          github_token: ${{ github.token }}
          check_source_release: 'true'
          check_not_published: 'true'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate npm package contents
        run: |
          set -euo pipefail
          npm pack --dry-run
        shell: bash
